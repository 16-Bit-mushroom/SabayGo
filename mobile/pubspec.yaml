name: mobile_v2_uv_express
description: "SabayGo — passenger, conductor and driver application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3

  # --- networking ---
  http: ^1.6.0

  # --- state ---
  # ChangeNotifier already backs the existing ViewModels; provider adds
  # the injection and rebuild plumbing so screens stop holding their own
  # mock lists.
  provider: ^6.1.2

  # --- storage ---
  # Keychain on iOS, EncryptedSharedPreferences on Android. A JWT in
  # plain SharedPreferences is readable by any app on a rooted device,
  # and rooted Android is common on the handsets crew actually carry.
  flutter_secure_storage: ^9.2.2

  # --- device ---
  mobile_scanner: ^7.2.1        # conductor QR scanning
  qr_flutter: ^4.1.0            # passenger e-ticket rendering
  geolocator: ^13.0.2           # geofenced check-in
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0     # offline detection for the manifest
  url_launcher: ^6.3.1          # PayMongo checkout redirect

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
