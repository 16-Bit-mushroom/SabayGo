services:
  mysql:
    image: mysql:8.0
    container_name: sabaygo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Manila
    ports:
      # Host port 3307 so it never collides with a local mariadb-server.
      - "127.0.0.1:3307:3306"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      # innodb_lock_wait_timeout is deliberately LOW.
      # Your concurrency experiment needs losers to fail fast and visibly,
      # not hang for the 50s default and skew your latency numbers.
      - --innodb-lock-wait-timeout=5
      - --transaction-isolation=READ-COMMITTED
      - --slow-query-log=1
      - --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: sabaygo-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: sabaygo_mysql_data
