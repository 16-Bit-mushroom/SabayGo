name: mobile_v2_uv_express
description: "SabayGo — passenger, conductor and driver application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3

  # --- networking ---
  http: ^1.6.0

  # --- state ---
  # ChangeNotifier already backs the existing ViewModels; provider adds
  # the injection and rebuild plumbing so screens stop holding their own
  # mock lists.
  provider: ^6.1.2

  # --- storage ---
  # Keychain on iOS, EncryptedSharedPreferences on Android. A JWT in
  # plain SharedPreferences is readable by any app on a rooted device,
  # and rooted Android is common on the handsets crew actually carry.
  flutter_secure_storage: ^9.2.2
  # On-device queue for walk-ins logged in a connectivity dead zone --
  # the offline-capable conductor manifest (spec section 2.3.5).
  sqflite: ^2.4.1
  path: ^1.9.0

  # --- device ---
  mobile_scanner: ^7.2.1        # conductor QR scanning
  qr_flutter: ^4.1.0            # passenger e-ticket rendering
  geolocator: ^13.0.2           # geofenced check-in
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0     # offline detection for the manifest
  url_launcher: ^6.3.1          # PayMongo checkout redirect

  # --- maps ---
  # NAHGM's client half. OpenStreetMap tiles via flutter_map rather than the
  # Google Maps SDK: no API key, no billing account and no per-load quota
  # standing between the panel and a working demo, and the same widget runs
  # on Android and on Flutter Web, so the console and the handset draw the
  # route with one implementation instead of two.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The official SABAY GO mark. Drawn by `BrandLogo`, never by a screen
  # directly, so its size steps and screen-reader name have one owner.
  assets:
    - assets/branding/sabaygo_logo.png

  # Bundled, not fetched and not borrowed from the platform.
  #
  # Nothing declared a family before this, so every screen rendered in
  # whatever face the host supplied: Roboto on stock Android, One UI Sans on
  # a Samsung, and the browser's default on Flutter Web -- which is how the
  # console and the defence-room demo run. Three typefaces for one product.
  #
  # google_fonts was the alternative and is the wrong tool here: it fetches
  # at first run, and this app is used in connectivity dead zones by design.
  # A font that arrives over the network is missing exactly when it matters.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
